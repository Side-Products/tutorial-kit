<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tutorials Kit demo</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f5f4fa;
				color: #242035;
				font-family: system-ui, sans-serif;
			}
			nav {
				padding: 24px 8%;
				background: white;
				border-bottom: 1px solid #e5e2ef;
				font-weight: 700;
			}
			main {
				max-width: 900px;
				margin: 80px auto;
				padding: 0 32px;
			}
			.eyebrow {
				color: #7455c9;
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			h1 {
				font-size: clamp(32px, 4vw, 56px);
				letter-spacing: -0.04em;
				margin: 16px 0;
			}
			p {
				line-height: 1.7;
				color: #696278;
			}
			article {
				margin-top: 32px;
				padding: 32px;
				background: white;
				border: 1px solid #e5e2ef;
				border-radius: 16px;
			}
			button {
				border: 0;
				border-radius: 8px;
				padding: 14px 24px;
				background: #7455c9;
				color: white;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid #242035;
				outline-offset: 4px;
			}
			#status {
				min-height: 28px;
			}
		</style>
	</head>
	<body>
		<nav>Tutorials Kit / Demo workspace</nav>
		<main>
			<div class="eyebrow">Your first recording</div>
			<h1>A little workflow. A complete tutorial.</h1>
			<p>This local demo uses synthetic data. Create a sample project to try recording a browser workflow.</p>
			<article>
				<h2>Project workspace</h2>
				<p>Capture a clear starting point, an action, and its result.</p>
				<button id="create" type="button">Create sample project</button>
				<p id="status" role="status" aria-live="polite">No projects yet.</p>
			</article>
		</main>
		<script>
			document.getElementById("create").addEventListener("click", () => {
				document.getElementById("status").textContent = "Sample project created. Ready for your next idea.";
			});
		</script>
	</body>
</html>
